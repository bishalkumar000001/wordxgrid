<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#17212b">
<title>Ludo King — Telegram Mini App</title>
<link rel="stylesheet" href="/static/ludo/style.css">
</head>
<body>

<!-- ───────────── LOADING SCREEN ───────────── -->
<div id="screen-loading" class="screen active">
  <div class="loading-inner">
    <div class="loading-logo">🎲</div>
    <h2>Ludo King</h2>
    <div class="loading-bar"><div class="loading-fill"></div></div>
    <p class="loading-text">Loading…</p>
  </div>
</div>

<!-- ───────────── LOBBY SCREEN ───────────── -->
<div id="screen-lobby" class="screen">
  <div class="screen-header">
    <div class="header-logo">🎲</div>
    <div class="header-title">
      <h1>Ludo King</h1>
      <p class="header-sub">Multiplayer Mini App</p>
    </div>
    <div class="header-user" id="header-user">
      <div class="avatar" id="lobby-avatar">?</div>
    </div>
  </div>

  <div class="lobby-content">
    <!-- Create Room Card -->
    <div class="card">
      <h3 class="card-title">🆕 New Room</h3>
      <div class="form-row">
        <label class="toggle-label">
          <span>Private Room</span>
          <div class="toggle-wrap">
            <input type="checkbox" id="toggle-private">
            <div class="toggle-track"><div class="toggle-thumb"></div></div>
          </div>
        </label>
      </div>
      <div class="form-row">
        <label class="select-label">Max Players</label>
        <div class="segmented" id="max-players-select">
          <button class="seg-btn" data-val="2">2</button>
          <button class="seg-btn" data-val="3">3</button>
          <button class="seg-btn active" data-val="4">4</button>
        </div>
      </div>
      <button class="btn btn-primary btn-full" id="btn-create-room">Create Room</button>
    </div>

    <!-- Join by Code Card -->
    <div class="card">
      <h3 class="card-title">🔗 Join by Invite Code</h3>
      <div class="input-row">
        <input type="text" id="invite-code-input" class="text-input"
               placeholder="Enter invite code (e.g. ABC123)"
               maxlength="6" autocomplete="off" autocorrect="off"
               autocapitalize="characters" spellcheck="false">
        <button class="btn btn-secondary" id="btn-join-code">Join</button>
      </div>
    </div>

    <!-- Public Rooms Card -->
    <div class="card">
      <div class="card-title-row">
        <h3 class="card-title">🌐 Public Rooms</h3>
        <button class="btn-icon" id="btn-refresh-rooms" title="Refresh">↻</button>
      </div>
      <div id="rooms-list">
        <div class="empty-state">
          <span class="empty-icon">🎮</span>
          <p>No public rooms yet.<br>Create one!</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ───────────── ROOM (WAITING) SCREEN ───────────── -->
<div id="screen-room" class="screen">
  <div class="screen-header">
    <button class="btn-back" id="btn-leave-room">← Leave</button>
    <h1 class="header-center">Waiting Room</h1>
    <div></div>
  </div>

  <div class="room-content">
    <!-- Invite Card -->
    <div class="card invite-card">
      <div class="invite-label">Invite Code</div>
      <div class="invite-row">
        <div class="invite-code" id="room-invite-code">------</div>
        <button class="btn btn-icon-sm" id="btn-copy-invite" title="Copy">📋</button>
        <button class="btn btn-icon-sm" id="btn-share-invite" title="Share">📤</button>
      </div>
      <div class="invite-hint">Share this code with friends to join!</div>
    </div>

    <!-- Players Card -->
    <div class="card">
      <h3 class="card-title">👥 Players <span id="room-player-count" class="badge">0/4</span></h3>
      <div id="room-players-list"></div>
    </div>

    <!-- Room Status -->
    <div id="room-status-msg" class="status-msg"></div>

    <!-- Action Buttons -->
    <div class="room-actions">
      <button class="btn btn-secondary btn-full" id="btn-ready" style="display:none">✅ Ready</button>
      <button class="btn btn-primary btn-full" id="btn-start-game" style="display:none">▶️ Start Game</button>
    </div>
  </div>
</div>

<!-- ───────────── GAME SCREEN ───────────── -->
<div id="screen-game" class="screen">
  <!-- Turn indicator bar -->
  <div class="turn-bar" id="turn-bar">
    <div class="turn-color-dot" id="turn-dot"></div>
    <div class="turn-name" id="turn-name">Loading…</div>
    <div class="turn-timer" id="turn-timer">60</div>
  </div>

  <!-- Board -->
  <div class="board-wrapper">
    <div class="board" id="ludo-board"></div>
    <div class="tokens-layer" id="tokens-layer"></div>
  </div>

  <!-- Dice area -->
  <div class="dice-area" id="dice-area">
    <div class="players-mini" id="players-mini"></div>
    <div class="dice-center">
      <div class="dice-container" id="dice-container">
        <div class="dice" id="dice">
          <div class="dice-face" id="dice-face">🎲</div>
        </div>
      </div>
      <button class="btn btn-primary btn-dice" id="btn-roll-dice" disabled>Roll Dice</button>
    </div>
    <div class="captures-log" id="captures-log"></div>
  </div>
</div>

<!-- ───────────── RESULT SCREEN ───────────── -->
<div id="screen-result" class="screen">
  <div class="result-inner">
    <div class="result-trophy">🏆</div>
    <h2 class="result-title" id="result-title">Game Over!</h2>
    <div class="result-rankings" id="result-rankings"></div>
    <button class="btn btn-primary btn-full" id="btn-play-again">🎲 Play Again</button>
  </div>
</div>

<!-- ───────────── TOAST ───────────── -->
<div id="toast" class="toast" aria-live="polite"></div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/static/ludo/app.js"></script>
</body>
</html>
